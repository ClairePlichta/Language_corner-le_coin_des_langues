<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 3 · Il fait…</title><style>:root{--cream:#fbf7f2;--sage:#71816d;--ink:#464945;--muted:#777b76;--line:#e8e0d9;--white:#fffdf9;--terra:#9b6957;--green:#287447;--red:#b64040}*{box-sizing:border-box}body{margin:0;font:16px/1.6 'Avenir Next',Avenir,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 8%,#f3e6e6,transparent 25%),radial-gradient(circle at 92% 10%,#e7eee5,transparent 25%),var(--cream)}a{color:inherit}.wrap{width:min(900px,92%);margin:auto}.top{display:flex;justify-content:space-between;padding:23px 0}.brand{font-weight:700;text-decoration:none}.crumb{color:var(--sage);font-weight:700;text-decoration:none}.hero{text-align:center;padding:30px 14px}.eyebrow{display:inline-block;padding:7px 14px;border-radius:999px;background:#f1e3dc;color:var(--terra);font-size:12px;font-weight:700;text-transform:uppercase}.hero h1{font:500 clamp(34px,6vw,48px)/1.15 Georgia,serif;margin:15px 0 8px}.muted{color:var(--muted)}.quiz{background:var(--white);border:1px solid var(--line);border-radius:25px;padding:28px;margin:20px 0;box-shadow:0 12px 32px #4137300d}.q{padding:15px 0;border-bottom:1px solid #eee8e2}.q:last-child{border-bottom:0}.q p{margin:0 0 9px;font-weight:650}.q input,.q select{padding:9px 11px;border:1px solid #cfc8c0;border-radius:9px;font:inherit;max-width:100%}.weather-pic{display:block;font-size:45px;margin:0 0 4px}.feedback{display:block;font-weight:700;margin-top:6px}.correct{color:var(--green)}.incorrect{color:var(--red)}button{display:inline-block;padding:11px 18px;border:0;border-radius:24px;background:var(--sage);color:white;font-weight:700;cursor:pointer}.secondary{background:var(--terra)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.result{font-weight:800}.back{display:inline-block;color:var(--sage);font-weight:700;text-decoration:none;margin:10px 0 30px}footer{border-top:1px solid var(--line);padding:25px;text-align:center;color:#888;font-size:13px}@media(max-width:650px){.quiz{padding:20px}.top{gap:12px;flex-wrap:wrap}}@media print{.top,.actions,.back,footer{display:none!important}.quiz{box-shadow:none}}
</style></head><body><header class="wrap top"><a class="brand" href="index.html">Language Corner | Le coin des langues</a><a class="crumb" href="francais-a2-meteo.html">← Tous les quiz météo</a></header><main class="wrap"><section class="hero"><span class="eyebrow">Français · A2 · Quiz 3</span><h1 id="title"></h1><p id="instruction" class="muted"></p></section><section id="quiz" class="quiz"><div id="questions"></div><div class="actions"><button onclick="checkQuiz()">Vérifier mes réponses</button><button class="secondary" onclick="savePdf()">Enregistrer le corrigé en PDF</button></div><p id="result" class="result"></p></section><a class="back" href="francais-a2-meteo.html">← Retour aux activités météo</a></main><footer>© 2026 Language Corner | Le coin des langues · Français A2</footer><script>const quizData={title:'Il fait…',instruction:'Choisis l’expression qui complète la phrase : « il fait chaud », « il fait froid » ou « il fait beau ».',items:[{type:'choice',prompt:'En hiver, quand la température est très basse, [[blank]].',options:['il fait froid','il fait chaud','il fait beau'],answer:'il fait froid'},{type:'choice',prompt:'En été, quand la température est élevée, [[blank]].',options:['il fait chaud','il fait froid','il fait beau'],answer:'il fait chaud'},{type:'choice',prompt:'Le soleil brille, le ciel est bleu et il ne pleut pas : [[blank]].',options:['il fait beau','il fait froid','il fait chaud'],answer:'il fait beau'},{type:'choice',prompt:'Je mets un manteau et une écharpe parce qu’[[blank]].',options:['il fait froid','il fait chaud','il fait beau'],answer:'il fait froid'},{type:'choice',prompt:'Nous allons pique-niquer : [[blank]] et le ciel est dégagé.',options:['il fait beau','il fait froid','il fait chaud'],answer:'il fait beau'},{type:'choice',prompt:'La température dépasse 30 degrés : [[blank]].',options:['il fait chaud','il fait froid','il fait beau'],answer:'il fait chaud'}]};</script><script>function normalize(value){return (value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ').trim()}
function renderQuiz(){const root=document.getElementById('questions');root.innerHTML=quizData.items.map((item,i)=>{let field='';if(item.type==='image'){field='<span class="weather-pic" role="img" aria-label="Illustration météo">'+item.image+'</span><p>'+item.prefix+' <select aria-label="Fin de la phrase '+(i+1)+'"><option value="">— Choisis —</option>'+item.options.map(v=>'<option>'+v+'</option>').join('')+'</select>.</p>'}else if(item.type==='choice'){field='<p>'+item.prompt.replace('[[blank]]','<select aria-label="Réponse '+(i+1)+'"><option value="">— Choisis —</option>'+item.options.map(v=>'<option>'+v+'</option>').join('')+'</select>')+'</p>'}else{field='<p>'+item.prompt.replace('[[blank]]','<input aria-label="Réponse '+(i+1)+'">')+'</p>'}return '<div class="q" data-index="'+i+'">'+field+'<span class="feedback" id="f-'+i+'"></span></div>'}).join('')}
function checkQuiz(){let score=0;quizData.items.forEach((item,i)=>{const field=document.querySelector('.q[data-index="'+i+'"] input,.q[data-index="'+i+'"] select');const ok=normalize(field.value)===normalize(item.answer);if(ok)score++;field.style.borderColor=ok?'#287447':'#b64040';const feedback=document.getElementById('f-'+i);feedback.className='feedback '+(ok?'correct':'incorrect');feedback.textContent=ok?'✓ Bonne réponse':'Faux'});document.getElementById('result').textContent='Résultat : '+score+' / '+quizData.items.length}
function savePdf(){checkQuiz();const copy=document.getElementById('quiz').cloneNode(true);copy.querySelectorAll('button').forEach(x=>x.remove());copy.querySelectorAll('input,select').forEach(field=>{const row=field.closest('.q'),index=Number(row.dataset.index),answer=quizData.items[index].answer,output=document.createElement('strong');output.textContent=answer;output.style.color='#287447';field.replaceWith(output)});const w=window.open('','_blank');if(!w){alert('Autorise les fenêtres pop-up pour enregistrer le PDF.');return}w.document.write('<!doctype html><html lang="fr"><meta charset="utf-8"><title>Corrigé · '+quizData.title+'</title><style>body{font:16px Arial;padding:28px;color:#333}h1{font:26px Georgia;color:#464945}.q{padding:10px;border-bottom:1px solid #ddd}.feedback,.result{color:#287447;font-weight:bold}.weather-pic{font-size:30px}.actions{display:none}</style><body><h1>'+quizData.title+'</h1>'+copy.outerHTML+'</body></html>');w.onload=()=>w.print();w.document.close()}
document.getElementById('title').textContent=quizData.title;document.getElementById('instruction').textContent=quizData.instruction;renderQuiz();
</script></body></html>
